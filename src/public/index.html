<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebSocket Client</title>
    <link rel="stylesheet" href="style.css" />
</head>
<body>
    <h1>WebSocket Client</h1>
    <button onclick="startGame()">Start Game</button>
    <div id="response" style="color: aliceblue;"></div>

    <div class="chess-container">
        <div class="chess-board" id="chessBoard"></div>
    </div>

    <script>
        let socket;
        let legalMovesSquares = [];
        const chessBoard = document.getElementById('chessBoard');

        document.addEventListener('DOMContentLoaded', () => {
            // Initialize WebSocket connection
            socket = new WebSocket('ws://localhost:8080');

            socket.addEventListener('open', () => {
                console.log('WebSocket connected');
            });

            socket.addEventListener('message', (event) => {
                try {
                    const data = JSON.parse(event.data);
                    
                    if (data.message) {
                        document.getElementById('response').innerText = `Server says: ${data.message}`;
                    }

                    if (data.responseEvent === 'response') {
                        const actionEvent = data.actionEvent;
                        switch (actionEvent) {
                            case 'startGame': {
                                console.log('initial state: ', data.game);
                                updateChessBoard(data.game, actionEvent);
                                break;
                            }
                            case 'getLegalMoves': {
                                const legalMoves = data.legalMoves;
                                console.log('data in legalMoves: ', data);
                                legalMovesSquares = [];
                                for (const legalMove of legalMoves) {
                                    const { position, moveType } = legalMove;
                                    legalMovesSquares.push(position);

                                    const index = +position[0] * 8 + +position[1];
                                    const square = chessBoard.children[index];

                                    console.log('square: ', square);

                                    square.classList.add('piece','possibleMove');
                                    
                                    square.onclick = () => {
                                        makeMove({
                                            from: data.piecePosition,
                                            to: position,
                                            moveType: moveType,
                                            promotionPiece: null
                                        });
                                    };
                                }
                                break;
                            }
                            case 'makeMove': {
                                const fromRow = +data.from[0];
                                const fromColumn = +data.from[1];
                                const toRow = +data.to[0];
                                const toColumn = +data.to[1];

                                const previousState = chessBoard.children[fromRow * 8 + fromColumn];
                                let pieceType = '';
                                let pieceColor = '';
                                previousState.classList.forEach((className) => {
                                    if (['rook', 'queen', 'bishop', 'pawn', 'knight', 'king'].includes(className)) {
                                        pieceType = className;
                                    }
                                    if (['white', 'black'].includes(className)) {
                                        pieceColor = className;
                                    }
                                })
                                
                                chessBoard.children[fromRow * 8 + fromColumn].innerHTML = '';
                                chessBoard.children[fromRow * 8 + fromColumn].classList.remove('piece', pieceType, pieceColor);
                                chessBoard.children[fromRow * 8 + fromColumn].removeAttribute('onclick');

                                chessBoard.children[toRow * 8 + toColumn].innerHTML = previousState.innerHTML;
                                chessBoard.children[fromRow * 8 + fromColumn].classList.add('piece', pieceType, pieceColor);
                                chessBoard.children[toRow * 8 + toColumn].onclick = () => requestLegalMoves([toRow, toColumn]);
                                
                                for (const legalMove of legalMovesSquares) {
                                    const i = +legalMove[0];
                                    const j = +legalMove[1];
                                    
                                    chessBoard.children[i * 8 + j].innerHTML = '';
                                    const classNames = chessBoard.children[i * 8 + j].classList;
                                    classNames.forEach(className => {
                                        if (!['light', 'dark'].includes(className)) {
                                            chessBoard.children[i * 8 + j].classList.remove(className);
                                        }
                                    });
                                    chessBoard.children[i * 8 + j].removeAttribute('onclick');

                                    if (!(toRow === i && toColumn === j)) {
                                        chessBoard.children[i * 8 + j].removeAttribute('onclick');
                                    }
                                }
                                legalMovesSquares = [];
                                console.log('inside makeMove response', data);
                                break;
                            }
                            default: {
                                console.log('invalid action event returned from server: ', actionEvent);
                                break;
                            }
                        }
                    } else {
                        console.error('received incorrect response event returned from server: ', data.responseEvent);
                    }
                } catch (error) {
                    console.error('Error parsing server message:', error);
                }
            });

            socket.addEventListener('close', () => {
                console.log('WebSocket disconnected');
            });

            socket.addEventListener('error', (error) => {
                console.error('WebSocket Error:', error);
            });

            window.startGame = function() {
                if (socket.readyState === WebSocket.OPEN) {
                    socket.send(JSON.stringify({ action: 'startGame', message: 'hi' }));
                } else {
                    console.error('WebSocket not connected');
                }
            };

            function updateChessBoard(chessGame, actionEvent) {
                const chessBoardFromBackend = chessGame.chessBoard.board;
                chessBoard.innerHTML = '';

                for (let i = 0; i < 8; i++) {
                    for (let j = 0; j < 8; j++) {
                        
                        const square = document.createElement('div');
                        square.classList.add((i + j) % 2 === 0 ? 'light' : 'dark');

                        if (chessBoardFromBackend[`${i}${j}`]) {
                            
                            const piece = chessBoardFromBackend[`${i}${j}`];
                            
                            square.classList.add('piece', piece.color, piece.type.toLowerCase());
                            square.onclick = () => requestLegalMoves([i, j]);
                        }

                        chessBoard.appendChild(square);
                    }
                }
            }

            function requestLegalMoves(piecePosition) {
                if (socket.readyState === WebSocket.OPEN) {
                    socket.send(JSON.stringify({ action: 'getLegalMoves', piecePosition: `${piecePosition[0]}${piecePosition[1]}` }));
                }
            }

            function makeMove(data) {
                if (socket.readyState === WebSocket.OPEN) {
                    console.log('inside makeMove: ', data);
                    socket.send(JSON.stringify({ action: 'makeMove', ...data }));
                }
            }
        });
    </script>
</body>
</html>
